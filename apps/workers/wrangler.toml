name = "klass-workers"
main = "src/index.ts"
compatibility_date = "2026-09-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Sem coleta de métricas do wrangler: o build (deploy --dry-run) não para
# perguntando sobre telemetria quando roda sem terminal interativo (CI).
send_metrics = false

# Logs do Worker publicado no painel da Cloudflare (Workers Logs).
[observability]
enabled = true

# Nenhum valor de segredo entra neste arquivo. As variáveis abaixo são
# configuradas com `wrangler secret put <NOME>` (produção) ou num arquivo
# `.dev.vars` não versionado (desenvolvimento local) — ver README para o
# passo a passo.
#
# Necessárias em runtime (ver `src/shared/env.ts`):
#   SUPABASE_URL               URL do projeto Supabase
#   SUPABASE_SERVICE_ROLE_KEY  chave de service role — nunca no frontend
#   RESEND_API_KEY             chave de API do Resend
#   ALLOWED_ORIGIN             origem do frontend liberada no CORS
#                              (padrão de desenvolvimento: http://localhost:5173)
#   WEBHOOK_SECRET             valida o header Authorization dos Database
#                              Webhooks do Supabase — ver README (seção MS3)
#   EMAIL_REMETENTE            opcional; remetente dos e-mails, ex.
#                              "Klass <no-reply@seu-dominio>" (domínio
#                              verificado no Resend). Sem ela, usa o
#                              remetente de teste onboarding@resend.dev, que
#                              só entrega para o dono da conta Resend.
